---
- name: Install iscsi plugin for poly-csi
  hosts: uni_csi_nodes
  become: true

  vars:
    local_binary_path: ../../bin/builtin_plugin

  tasks:
  - name: create /opt/uni_csi_plugins
    file:
      path: /opt/uni_csi_plugins
      state: directory
      mode: "0755"
      owner: root
      group: root

  - name: copy plugin binary
    copy:
      src: "{{ local_binary_path }}"
      dest: /opt/uni_csi_plugins/builtin
      owner: root
      group: root
      mode: "0755"
    notify:
    - service_restart

  - name: copy plugin config
    copy:
      src: ./config-iscsi.yaml
      dest: /opt/uni_csi_plugins/iscsi.yaml
      owner: root
      group: root
      mode: "0644"
    notify:
    - service_restart

  - name: copy service
    copy:
      src: ./uni_csi_plugin_iscsi.service
      dest: /etc/systemd/system/uni_csi_plugin_iscsi.service
      owner: root
      group: root
      mode: "0644"
    notify:
    - systemd_daemon-reload
    - service_restart

  handlers:
  - name: systemd_daemon-reload
    ansible.builtin.systemd_service:
      daemon_reload: true
  - name: start uni_csi_plugin_iscsi.service
    listen:
    - service_restart
    ansible.builtin.systemd_service:
      name: uni_csi_plugin_iscsi.service
      enabled: true
      state: restarted
      daemon_reload: false
