---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: poly-csi-smb
provisioner: io.meoe.poly-csi
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate

parameters:
  dispatch.mode: native-fs
  dispatch.server: rose

  fs.storage.type: zfs-dataset
  fs.storage.id: '{{.K8sNs}}.{{.K8sPvc}}.{{.RequestName}}'
  fs.storage.parentDataset: rose/test

  fs.share.type: samba
  fs.share.id: '{{.K8sNs}}.{{.K8sPvc}}.{{.RequestName}}'

  fs.connector.id: smb
  fs.address: storage

mountOptions:
- noatime
- vers=3.1.1
- posix
# - dir_mode=0775
# - file_mode=0664
- seal
- multichannel
- max_channels=2
