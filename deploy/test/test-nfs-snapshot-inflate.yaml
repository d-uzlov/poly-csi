---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-sc-poly-csi-nfs-snapshot-inflate
  labels:
    test: pvc
spec:
  storageClassName: poly-csi-nfs
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
  dataSourceRef:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: test-sc-poly-csi-nfs-snapshot
