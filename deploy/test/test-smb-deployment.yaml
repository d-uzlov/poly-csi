---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-sc-poly-csi-smb
  labels:
    test: pvc
spec:
  selector:
    matchLabels:
      app: test-sc-poly-csi-smb
  template:
    metadata:
      labels:
        app: test-sc-poly-csi-smb
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 3000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: alpine
        image: docker.io/alpine:3.24.2
        command: [ "/bin/sh", "-c", "trap : TERM INT; sleep infinity & wait" ]
        resources:
          limits:
            memory: 128Mi
        volumeMounts:
        - mountPath: /mnt/data
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: test-sc-poly-csi-smb
