---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: poly-csi-nvme
provisioner: io.meoe.poly-csi
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate

parameters:
  dispatch.serverName: rose
  dispatch.storageType: zfs-zvol
  dispatch.storageIdTemplate: '{{.K8sNs}}.{{.K8sPvc}}.{{.RequestName}}'
  dispatch.shareType: nvmet-keeper
  dispatch.shareIdTemplate: '{{.K8sNs}}.{{.K8sPvc}}.{{.RequestName}}'
  dispatch.connectorId: nvme
  dispatch.nodePreset: nvmeCon,nvmeIoq4
  dispatch.addressNames: storage,k8s
  dispatch.fsFormatSide: node

  # none, sameShare, sameServer, separate
  # dispatch.journalVolume: sameShare

  # journal.serverName: rose
  # journal.storageType: zfs-zvol
  # journal.storageIdTemplate: '{{.K8sNs}}.{{.K8sPvc}}.{{.RequestName}}'
  # # journal.shareType: nvmet-keeper
  # journal.shareIdTemplate: '{{.K8sNs}}.{{.K8sPvc}}.{{.RequestName}}'
  # # journal.connectorId: nvme
  # # journal.nodePreset: nvmeCon,nvmeIoq4
  # # journal.addressNames: storage,k8s

  zfs.parentDataset: rose/test
  zfs.reservedPercent: 0%
  zfs.volblocksize: 32k

  nvmet.nvmetPortName: '4420'
  nvmet.connectPort: '4420'
  nvmet.transportType: tcp
  nvmet.authType: chap-provision

  fsType: ext4

mountOptions:
- noatime
- discard
