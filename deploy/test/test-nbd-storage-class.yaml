---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: poly-csi-nbd
provisioner: io.meoe.poly-csi
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate

parameters:
  dispatch.mode: block-fs
  dispatch.server: rose

  fs.type: ext4
  fs.separateJournal: 'false'
  fs.bytesPerInode: 64k
  fs.journalSizeDenom: '70'
  fs.reservedPercent: '1'

  block.server: rose
  block.storage.type: zfs-zvol
  block.storage.id: '{{.K8sNs}}.{{.K8sPvc}}.{{.RequestName}}'
  block.storage.parentDataset: rose/test
  block.storage.reservedPercent: 0%
  block.storage.volblocksize: 32k

  block.share.type: nbd
  block.share.id: '{{.K8sNs}}.{{.K8sPvc}}.{{.RequestName}}'
  block.share.connectPort: '10809'

  block.connector.id: nbd
  block.connector.preset: ''
  block.cgroupPreset: ''
  block.address: storage

mountOptions:
- noatime
- nodiratime
- discard
