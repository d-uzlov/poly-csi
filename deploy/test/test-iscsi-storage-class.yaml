---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: poly-csi-iscsi
provisioner: io.meoe.poly-csi
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate

parameters:
  dispatch.mode: block-fs
  dispatch.server: tulip

  fs.type: ext4
  fs.separateJournal: 'false'
  fs.bytesPerInode: 64k
  fs.journalSizeDenom: '70'
  fs.reservedPercent: '1'

  block.server: tulip
  block.storage.type: zfs-zvol
  block.storage.id: '{{.K8sNs}}.{{.K8sPvc}}.{{.RequestName}}'
  block.storage.parentDataset: tulip/test-guid
  block.storage.reservedPercent: 0%
  block.storage.volblocksize: 32k

  block.share.type: targetcli
  block.share.id: '{{.K8sNs}}.{{.K8sPvc}}.{{.RequestName}}'
  block.share.transport: tcp
  block.share.listenPort: '3260'
  block.share.authType: chap-provision

  block.connector.id: ublk_iscsi
  block.connector.preset: basic
  block.cgroupPreset: ''
  block.address: storage

mountOptions:
- noatime
- nodiratime
- discard
