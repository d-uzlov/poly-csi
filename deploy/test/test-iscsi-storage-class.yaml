---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: poly-csi-iscsi
provisioner: io.meoe.poly-csi
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate

parameters:
  dispatch.serverName: tulip
  dispatch.storageType: zfs-zvol
  dispatch.storageIdTemplate: '{{.K8sNs}}.{{.K8sPvc}}.{{.RequestName}}'
  dispatch.shareType: targetcli
  dispatch.shareIdTemplate: '{{.K8sNs}}.{{.K8sPvc}}.{{.RequestName}}'
  dispatch.connectorId: iscsi
  dispatch.addressNames: storage,k8s
  zfs.parentDataset: tulip/test-guid
  lio.transport: tcp
  lio.listenPort: '3260'
  lio.authType: chap-provision
  
  fsType: ext4

mountOptions:
- noatime
- discard
