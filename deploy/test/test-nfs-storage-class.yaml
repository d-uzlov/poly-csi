---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: poly-csi-nfs
provisioner: io.meoe.poly-csi
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate

parameters:
  dispatch.mode: native-fs
  dispatch.server: tulip

  fs.storage.type: zfs-dataset
  fs.storage.id: '{{.K8sNs}}.{{.K8sPvc}}.{{.RequestName}}'
  fs.storage.parentDataset: tulip/test-guid

  fs.share.type: zfs-sharenfs
  fs.share.id: '{{.K8sNs}}.{{.K8sPvc}}.{{.RequestName}}'
  fs.share.shareOptions: rw,no_subtree_check,no_root_squash

  fs.connector.id: nfs
  fs.address: storage

mountOptions:
- vers=4.2
- soft
- noatime
- nodiratime
- rsize=262144
- wsize=262144
