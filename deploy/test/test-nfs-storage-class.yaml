---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: poly-csi-nfs
provisioner: io.meoe.poly-csi
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate

parameters:
  dispatch.serverName: tulip
  dispatch.storageType: zfs-dataset
  dispatch.storageIdTemplate: '{{.K8sNs}}.{{.K8sPvc}}.{{.RequestName}}'
  dispatch.shareType: zfs-sharenfs
  dispatch.shareIdTemplate: '{{.K8sNs}}.{{.K8sPvc}}.{{.RequestName}}'
  dispatch.connectorId: nfs
  dispatch.addressNames: storage

  zfs.parentDataset: tulip/test-guid

  nfs.shareOptions: rw,no_subtree_check,no_root_squash

  # fsType: nfs4

mountOptions:
- soft
- noatime
- nodiratime
- rsize=262144
- wsize=262144
