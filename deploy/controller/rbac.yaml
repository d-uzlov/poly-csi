---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: poly-csi-controller
  namespace: pv-poly
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: pv-poly
  name: controller
rules:
# leases are needed for all controller sidecars
- apiGroups: [ "coordination.k8s.io" ]
  resources: [ "leases" ]
  verbs: [ "get", "watch", "list", "delete", "update", "create" ]
# used by external-provisioner
- apiGroups: [ "storage.k8s.io" ]
  resources: [ "csistoragecapacities" ]
  verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]
# The GET permissions below are needed for walking up the ownership chain
# for CSIStorageCapacity. They are sufficient for deployment via
# StatefulSet (only needs to get Pod) and Deployment (needs to get
# Pod and then ReplicaSet to find the Deployment).
- apiGroups: [ "" ]
  resources: [ "pods" ]
  verbs: [ "get" ]
- apiGroups: [ "apps" ]
  resources: [ "replicasets" ]
  verbs: [ "get" ]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: poly-csi-provisioner
  namespace: pv-poly
subjects:
- kind: ServiceAccount
  name: poly-csi-controller
  namespace: pv-poly
roleRef:
  kind: Role
  name: controller
  apiGroup: rbac.authorization.k8s.io
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: poly-csi:controller
rules:
# used by provisioner, attacher, resizer
- apiGroups: [ "" ]
  resources: [ "persistentvolumes" ]
  verbs: [ "get", "list", "watch", "create", "patch", "delete" ]
# used by provisioner, resizer
- apiGroups: [ "" ]
  resources: [ "persistentvolumeclaims" ]
  verbs: [ "get", "list", "watch", "update" ]
# used by resizer
- apiGroups: [ "" ]
  resources: [ "persistentvolumeclaims/status" ]
  verbs: [ "patch" ]
# used by provisioner
- apiGroups: [ "storage.k8s.io" ]
  resources: [ "storageclasses" ]
  verbs: [ "get", "list", "watch" ]
# used by provisioner, resizer
- apiGroups: [ "" ]
  resources: [ "events" ]
  verbs: [ "list", "watch", "create", "update", "patch" ]
# used by provisioner to protect snapshots from being deleted during provisioning
- apiGroups: [ "snapshot.storage.k8s.io" ]
  resources: [ "volumesnapshots" ]
  verbs: [ "get", "list", "watch", "update" ]
# used by provisioner to protect snapshots from being deleted during provisioning
- apiGroups: [ "snapshot.storage.k8s.io" ]
  resources: [ "volumesnapshotcontents" ]
  verbs: [ "get", "list" ]
# used by provisioner, attacher
- apiGroups: [ "storage.k8s.io" ]
  resources: [ "csinodes" ]
  verbs: [ "get", "list", "watch" ]
# used by provisioner
- apiGroups: [ "" ]
  resources: [ "nodes" ]
  verbs: [ "get", "list", "watch" ]
# used by provisioner, attacher
- apiGroups: [ "storage.k8s.io" ]
  resources: [ "volumeattachments" ]
  verbs: [ "get", "list", "watch" ]
# used by attacher
- apiGroups: [ "storage.k8s.io" ]
  resources: [ "volumeattachments/status" ]
  verbs: [ "patch" ]
# used by resizer?
- apiGroups: [ "storage.k8s.io" ]
  resources: [ "volumeattributesclasses" ]
  verbs: [ "get", "list", "watch" ]
# used by resizer, when it needs to enforce offline volume resizing
# - apiGroups: [ "" ]
#   resources: [ "pods" ]
#   verbs: [ "get", "list", "watch" ]

# used by external-provisioner
#- apiGroups: ["gateway.networking.k8s.io"]
#  resources: ["referencegrants"]
#  verbs: ["get", "list", "watch"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: poly-csi:provisioner
subjects:
- kind: ServiceAccount
  name: poly-csi-controller
  namespace: pv-poly
roleRef:
  kind: ClusterRole
  name: poly-csi:controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: poly-csi:snapshotter
rules:
- apiGroups: [ "" ]
  resources: [ "events" ]
  verbs: [ "list", "watch", "create", "update", "patch" ]
- apiGroups: [ "snapshot.storage.k8s.io" ]
  resources: [ "volumesnapshotclasses" ]
  verbs: [ "get", "list", "watch" ]
- apiGroups: [ "snapshot.storage.k8s.io" ]
  resources: [ "volumesnapshotcontents" ]
  verbs: [ "get", "list", "watch", "update", "patch" ]
- apiGroups: [ "snapshot.storage.k8s.io" ]
  resources: [ "volumesnapshotcontents/status" ]
  verbs: [ "update", "patch" ]
- apiGroups: [ "groupsnapshot.storage.k8s.io" ]
  resources: [ "volumegroupsnapshotclasses" ]
  verbs: [ "get", "list", "watch" ]
- apiGroups: [ "groupsnapshot.storage.k8s.io" ]
  resources: [ "volumegroupsnapshotcontents" ]
  verbs: [ "get", "list", "watch", "update", "patch" ]
- apiGroups: [ "groupsnapshot.storage.k8s.io" ]
  resources: [ "volumegroupsnapshotcontents/status" ]
  verbs: [ "update", "patch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: poly-csi:snapshotter
subjects:
- kind: ServiceAccount
  namespace: pv-poly
  name: poly-csi-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: poly-csi:snapshotter
