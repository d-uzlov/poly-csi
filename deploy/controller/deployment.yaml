---
kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: pv-poly
  name: poly-csi-controller
  labels:
    app.kubernetes.io/name: poly-csi
    app.kubernetes.io/csi-role: controller
spec:
  replicas: 1
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: poly-csi
      app.kubernetes.io/csi-role: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: poly-csi
        app.kubernetes.io/csi-role: controller
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccountName: poly-csi-controller
      priorityClassName: system-cluster-critical
      containers:
      - name: csi-driver
        image: harbor.k8s.lan/local-test/poly-csi-controller:v0.3.36
        args:
        - --csi-name=io.meoe.poly-csi
        - --listen-address=unix:///csi-data/csi.sock
        - --config=/config/config.yaml
        - --log-level=debug
        resources:
          limits:
            memory: 30Mi
          requests:
            memory: 15Mi
        # env: []
        volumeMounts:
        - mountPath: /csi-data
          name: socket-dir
        - mountPath: /config
          name: config
        - mountPath: /poly-csi/ssh-keys
          name: ssh-keys
      # https://github.com/kubernetes-csi/external-attacher
      - name: external-attacher
        image: registry.k8s.io/sig-storage/csi-attacher:v4.11.0
        args:
        - --v=5
        - --leader-election
        - --leader-election-namespace=$(NAMESPACE)
        - --timeout=90s
        - --worker-threads=10
        - --csi-address=/csi-data/csi.sock
        - --automaxprocs=true
        resources:
          limits:
            memory: 30Mi
          requests:
            memory: 20Mi
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        volumeMounts:
        - mountPath: /csi-data
          name: socket-dir
      # https://github.com/kubernetes-csi/external-provisioner
      - name: external-provisioner
        image: registry.k8s.io/sig-storage/csi-provisioner:v6.2.0
        args:
        - --v=5
        - --leader-election
        - --leader-election-namespace=$(NAMESPACE)
        - --timeout=90s
        - --worker-threads=10
        - --extra-create-metadata
        - --csi-address=/csi-data/csi.sock
        - --enable-capacity=true
        - --capacity-ownerref-level=2
        - --capacity-for-immediate-binding=true
        - --automaxprocs=true
        resources:
          limits:
            memory: 30Mi
          requests:
            memory: 25Mi
        volumeMounts:
        - mountPath: /csi-data
          name: socket-dir
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: POD_NAME
          # external-provisioner uses POD_NAME env to determine CSIStorageCapacity owner
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
      # https://github.com/kubernetes-csi/external-resizer
      - name: external-resizer
        image: registry.k8s.io/sig-storage/csi-resizer:v2.1.0
        args:
        - --v=5
        - --leader-election
        - --leader-election-namespace=$(NAMESPACE)
        - --timeout=90s
        - --workers=10
        - --csi-address=/csi-data/csi.sock
        - --automaxprocs=true
        resources:
          limits:
            memory: 50Mi
          requests:
            memory: 25Mi
        volumeMounts:
        - mountPath: /csi-data
          name: socket-dir
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
      # https://github.com/kubernetes-csi/external-snapshotter
      - name: external-snapshotter
        image: registry.k8s.io/sig-storage/csi-snapshotter:v8.5.0
        args:
        - --v=5
        - --leader-election
        - --leader-election-namespace=$(NAMESPACE)
        - --timeout=90s
        - --worker-threads=10
        - --csi-address=/csi-data/csi.sock
        - --automaxprocs=true
        resources:
          limits:
            memory: 50Mi
          requests:
            memory: 25Mi
        volumeMounts:
        - mountPath: /csi-data
          name: socket-dir
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace

      volumes:
      - name: socket-dir
        emptyDir: {}
      - name: config
        configMap:
          name: controller-config
      - name: ssh-keys
        secret:
          secretName: ssh-keys
