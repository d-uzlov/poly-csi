---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: pv-poly
  name: poly-csi-registry
spec:
  selector:
    matchLabels:
      app: poly-csi-registry
  serviceName: poly-csi-registry
  replicas: 1
  template:
    metadata:
      labels:
        app: poly-csi-registry
    spec:
      containers:
      - name: registry
        image: harbor.k8s.lan/local-test/poly-csi-node-registry:v0.0.4
        ports:
        - name: http
          containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  namespace: pv-poly
  name: poly-csi-registry
spec:
  clusterIP: None
  selector:
    app: poly-csi-registry
  ports:
  - name: http
    port: 8080
    targetPort: 8080
