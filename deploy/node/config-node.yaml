nodeInfoDb:
  address: http://poly-csi-node-registry:8080
  interval: 15s

encrypt:
  nodeKey:
    path: /poly-csi/node/node_key.pem
  controllerPublicKey:
    path: /poly-csi/controller/controller_key.pub.pem

devFolder: /host/dev

execConfig:
  insecureEchoCommands: true

multipath:
  id: multipath
  type: plugin
  subtype: http.json.dev
  config:
    socket: /run/io.meoe.poly-csi/plugins/multipath-container/multipath.sock

connectors:
- id: nfs
  type: builtin
  subtype: nfs
- id: smb
  type: builtin
  subtype: cifs
- id: nvme
  type: builtin
  subtype: nvme
  config:
    nvmeCmd: [ "nvme" ]
    parseKernelLog: true
- id: iscsi
  type: plugin
  subtype: http.json.dev
  config:
    socket: /run/io.meoe.poly-csi/plugins/iscsi-container/iscsi.sock

networks:
- includeCidr:
  - 0.0.0.0/0
  - ::/0
  excludeCidr:
  - 127.0.0.0/8
  - 169.254.0.0/16
  - ::1/128
  - fe80::/10
