nodeInfoDb:
  address: http://poly-csi-registry:8080
  interval: 15s

encrypt:
  nodeKey:
    path: /var/lib/kubelet/plugins/io.meoe.poly-csi/node_key.pem

devFolder: /host/dev
podCgroupRoot: /sys/fs/cgroup/kubepods

execConfig: {}

multipath:
  type: local
  config:
    mapperFolder: /host/dev/mapper
    multipathdCmd: [ multipathd ]

connectors:
- id: nfs
  type: nfs
- id: smb
  type: cifs
- id: nvme
  type: nvme
  config:
    nvmeCmd: [ "nvme" ]
    parseKernelLog: true
- id: iscsi
  type: plugin_json
  config:
    socket: /run/io.meoe.poly-csi/plugins/iscsi-container/iscsi.sock

presets:
- name: nvmeCon
  params:
    nvme.keepAliveTimeoutSec: 1
    nvme.controllerLossTimeoutSec: -1
    nvme.reconnectDelaySec: 1
- name: nvmeIoq4
  params:
    nvme.ioQueues: 4
- name: cgroupIo10
  params:
    cgroup_io_max.readBw: 10Mi
    cgroup_io_max.writeBw: 10Mi
    cgroup_io_max.readIops: 100
    cgroup_io_max.writeIops: 100
- name: cgroupIo100
  params:
    cgroup_io_max.readBw: 100Mi
    cgroup_io_max.writeBw: 100Mi
    cgroup_io_max.readIops: 1000
    cgroup_io_max.writeIops: 1000

networks:
- includeCidr:
  - 0.0.0.0/0
  - ::/0
  excludeCidr:
  - 127.0.0.0/8
  - 169.254.0.0/16
  - ::1/128
  - fe80::/10

logs:
  default:
    logLevel: debug
    echoCommands: false
    confirmMicroOps: true
    skipOnSuccess: false

  nodeInfo:
    echoCommands: false
    confirmMicroOps: false
    skipOnSuccess: true

  rpc:

    /csi.v1.Identity/GetPluginInfo:
      skipOnSuccess: true
    /csi.v1.Identity/GetPluginCapabilities:
      skipOnSuccess: true
    /csi.v1.Identity/Probe:
      skipOnSuccess: true
    /csi.v1.Node/NodeGetCapabilities:
      skipOnSuccess: true
    /csi.v1.Node/NodeGetInfo:
      skipOnSuccess: true

    /csi.v1.Node/NodeStageVolume:
      echoCommands: true
      echoResult: true
    /csi.v1.Node/NodeUnstageVolume:
      echoCommands: true
    /csi.v1.Node/NodePublishVolume:
      echoCommands: true
    /csi.v1.Node/NodeUnpublishVolume:
      echoCommands: true
    /csi.v1.Node/NodeExpandVolume:
      echoCommands: true

    /csi.v1.Node/NodeGetVolumeHealth:
      echoCommands: true
    /csi.v1.Node/NodeGetVolumeStats:
      echoCommands: true
      skipOnSuccess: true

disableCleanupOnFailure: true
