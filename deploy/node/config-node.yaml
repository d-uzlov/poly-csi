nodeInfoDb:
  address: http://poly-csi-node-registry:8080
  interval: 15s

encrypt:
  nodeKey:
    path: /poly-csi/node/node_key.pem
  controllerPublicKey:
    path: /poly-csi/controller/controller_key.pub.pem

devFolder: /host/dev

execConfig: {}

multipath:
  id: multipath
  type: plugin
  subtype: http.json.dev
  config:
    socket: /run/io.meoe.poly-csi/plugins/multipath-container/multipath.sock

connectors:
- id: nfs
  type: builtin
  subtype: nfs
- id: smb
  type: builtin
  subtype: cifs
- id: nvme
  type: builtin
  subtype: nvme
  config:
    nvmeCmd: [ "nvme" ]
    parseKernelLog: true
- id: iscsi
  type: plugin
  subtype: http.json.dev
  config:
    socket: /run/io.meoe.poly-csi/plugins/iscsi-container/iscsi.sock

networks:
- includeCidr:
  - 0.0.0.0/0
  - ::/0
  excludeCidr:
  - 127.0.0.0/8
  - 169.254.0.0/16
  - ::1/128
  - fe80::/10

logs:
  default:
    logLevel: debug
    echoCommands: false
    confirmMicroOps: false
    skipOnSuccess: false

  nodeInfo:
    echoCommands: false
    confirmMicroOps: false
    skipOnSuccess: false

  rpc:

    /csi.v1.Identity/GetPluginInfo:
      skipOnSuccess: true
    /csi.v1.Identity/GetPluginCapabilities:
      skipOnSuccess: true
    /csi.v1.Identity/Probe:
      skipOnSuccess: true
    /csi.v1.Node/NodeGetCapabilities:
      skipOnSuccess: true
    /csi.v1.Node/NodeGetInfo:
      skipOnSuccess: true

    /csi.v1.Node/NodeStageVolume:
      echoCommands: true
    /csi.v1.Node/NodeUnstageVolume:
      echoCommands: true
    /csi.v1.Node/NodePublishVolume:
      echoCommands: true
    /csi.v1.Node/NodeUnpublishVolume:
      echoCommands: true
    /csi.v1.Node/NodeExpandVolume:
      echoCommands: true

    /csi.v1.Node/NodeGetVolumeStats:
      echoCommands: true
      skipOnSuccess: true
