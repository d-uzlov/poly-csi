nodeInfoDb:
  address: http://poly-csi-registry:8080
  interval: 15s

encrypt:
  nodeKey:
    path: /var/lib/kubelet/plugins/io.meoe.poly-csi/node_key_hpke.pem

devFolder: /host/dev
podCgroupRoot: /sys/fs/cgroup/kubepods

execConfig: {}

multipath:
  type: local
  config:
    mapperFolder: /host/dev/mapper
    multipathdCmd: [ multipathd ]

blockConnectors:
- id: nvme
  type: nvme
  config:
    nvmeCmd: [ "nvme" ]
    parseKernelLog: true
  presets:
    basic:
      keepAliveTimeoutSec: 1
      controllerLossTimeoutSec: -1
      reconnectDelaySec: 1
      ioQueues: 4
- id: iscsi
  type: plugin
  config:
    socketPath: /run/io.meoe.poly-csi/plugins/iscsi-container/iscsi.sock
    remoteId: iscsi
- id: nbd
  type: plugin
  config:
    socketPath: /run/io.meoe.poly-csi/plugins/ublk-container/ublk.sock
    remoteId: ublk_nbd
- id: ublk_iscsi
  type: plugin
  config:
    socketPath: /run/io.meoe.poly-csi/plugins/ublk-container/ublk.sock
    remoteId: ublk_iscsi
- id: aoe
  type: aoe
  config:
    interfaces: [ eth0, eth1, eth2 ]

filesystems:
- id: ext4
  type: ext4
- id: xfs
  type: xfs
- id: nfs
  type: nfs
- id: smb
  type: cifs
- id: cifs
  type: cifs

blockCgroupPresets:
  tier10:
    readBw: 10Mi
    writeBw: 10Mi
    readIops: 100
    writeIops: 100
  tier100:
    readBw: 100Mi
    writeBw: 100Mi
    readIops: 1000
    writeIops: 1000

networks:
- includeCidr:
  - 0.0.0.0/0
  - ::/0
  excludeCidr:
  - 127.0.0.0/8
  - 169.254.0.0/16
  - ::1/128
  - fe80::/10

logs:
  default:
    logLevel: debug
    echoCommands: false
    confirmMicroOps: true
    skipOnSuccess: false

  nodeInfo:
    echoCommands: false
    confirmMicroOps: false
    skipOnSuccess: true

  rpc:

    /csi.v1.Identity/GetPluginInfo:
      skipOnSuccess: true
    /csi.v1.Identity/GetPluginCapabilities:
      skipOnSuccess: true
    /csi.v1.Identity/Probe:
      skipOnSuccess: true
    /csi.v1.Node/NodeGetCapabilities:
      skipOnSuccess: true
    /csi.v1.Node/NodeGetInfo:
      skipOnSuccess: true

    /csi.v1.Node/NodeStageVolume:
      echoCommands: true
      echoResult: true
    /csi.v1.Node/NodeUnstageVolume:
      echoCommands: true
    /csi.v1.Node/NodePublishVolume:
      echoCommands: true
    /csi.v1.Node/NodeUnpublishVolume:
      echoCommands: true
    /csi.v1.Node/NodeExpandVolume:
      echoCommands: true

    /csi.v1.Node/NodeGetVolumeHealth:
      echoCommands: true
    /csi.v1.Node/NodeGetVolumeStats:
      echoCommands: true
      skipOnSuccess: true
