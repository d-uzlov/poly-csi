---
kind: DaemonSet
apiVersion: apps/v1
metadata:
  namespace: pv-poly
  name: poly-csi-node
  labels:
    app.kubernetes.io/name: poly-csi
    app.kubernetes.io/csi-role: node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: poly-csi
      app.kubernetes.io/csi-role: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: poly-csi
        app.kubernetes.io/csi-role: node
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-node-critical
      # hostNetwork is required to correctly report node IPs and communicate with multipathd and iscsiadm
      hostNetwork: true
      # hostPID can be required on older kernels due to ublk bug
      #     https://lkml.rescloud.iu.edu/hypermail/linux/kernel/2601.1/06849.html
      # hostPID: true
      # hostUsers: false
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
      - name: modprobe
        image: docker.io/alpine:3.24.2
        command:
        - /bin/sh
        - -c
        - modprobe ublk_drv && modprobe aoe
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /lib/modules
          name: kernel-modules
      containers:
      - name: csi-driver
        image: harbor.k8s.lan/local-test/poly-csi-node:v0.4.127
        args:
        - --csi-name=io.meoe.poly-csi
        - --listen-address=unix:///var/lib/kubelet/plugins/io.meoe.poly-csi/csi.sock
        - --log-level=debug
        - --csi-node-id=$(CSI_NODE_ID)
        - --node-config=/poly-csi/config-node/config.yaml
        resources:
          limits:
            memory: 150Mi
          requests:
            cpu: 10m
            memory: 15Mi
        securityContext:
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
        env:
        - name: CSI_NODE_ID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        volumeMounts:
        - mountPath: /var/lib/kubelet/plugins/io.meoe.poly-csi/
          name: var-lib-kubelet-plugins-self
        - mountPath: /var/lib/kubelet/plugins/kubernetes.io/csi/io.meoe.poly-csi/
          # plugin folder is for staging
          name: host-var-lib-kubelet-csi
          mountPropagation: Bidirectional
        - mountPath: /var/lib/kubelet/pods/
          # pods folder is for publishing
          name: host-var-lib-kubelet-pods
          mountPropagation: Bidirectional
        - mountPath: /host/dev
          name: host-dev
          readOnly: true
        - mountPath: /poly-csi/config-node
          name: config-node
        - mountPath: /run/io.meoe.poly-csi/plugins
          name: poly-csi-plugins
          mountPropagation: Bidirectional

      # https://github.com/kubernetes-csi/node-driver-registrar
      - name: driver-registrar
        image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
        args:
        - --v=5
        - --automaxprocs
        - --logging-format=json
        - --plugin-registration-path=/registration
        - --csi-address=/var/lib/kubelet/plugins/io.meoe.poly-csi/csi.sock
        - --kubelet-registration-path=/var/lib/kubelet/plugins/io.meoe.poly-csi/csi.sock
        resources:
          limits:
            memory: 30Mi
          requests:
            cpu: 10m
            memory: 20Mi
        env:
        - name: KUBE_NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        volumeMounts:
        - mountPath: /var/lib/kubelet/plugins/io.meoe.poly-csi/
          name: var-lib-kubelet-plugins-self
        - mountPath: /registration
          name: registration-dir

      - name: iscsiadm
        image: harbor.k8s.lan/local-test/poly-csi-mounter-plugin:v0.4.123
        args:
        - --plugin-type=connector
        - --node-config=/poly-csi/iscsi-config/config.yaml
        resources:
          limits:
            memory: 150Mi
          requests:
            cpu: 10m
            memory: 15Mi
        securityContext:
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
        volumeMounts:
        - mountPath: /host
          name: host-root
          readOnly: true
        - mountPath: /host/var/lib/iscsi
          # remount iscsi config dir as rw
          name: host-root
          subPath: var/lib/iscsi
        - mountPath: /poly-csi/iscsi-config
          name: config-iscsi
        - mountPath: /run/io.meoe.poly-csi/plugins/iscsi-container
          name: poly-csi-plugins
          # TODO can external plugins even utilize extra filesystems without FUSE?
          mountPropagation: Bidirectional
          subPath: iscsi-container

      - name: ublk
        image: harbor.k8s.lan/local-test/poly-csi-ublk:v0.4.123
        args:
        - --plugin-type=ublk
        - --node-config=/poly-csi/ublk-config/config.yaml
        resources:
          limits:
            # TODO remove memory limit?
            # unlike kernel-based devices, ublk devices use container memory for buffers
            memory: 1500Mi
          requests:
            cpu: 10m
            memory: 15Mi
        securityContext:
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
          # seccompProfile:
          #   type: Unconfined
          # appArmorProfile:
          #   type: Unconfined
        terminationMessagePath: /tmp/termination
        volumeMounts:
        - mountPath: /poly-csi/ublk-config
          name: config-ublk
        - mountPath: /run/io.meoe.poly-csi/plugins/ublk-container
          name: poly-csi-plugins
          subPath: ublk-container
        - mountPath: /dev
          name: host-dev
          readOnly: true

      volumes:
      - name: var-lib-kubelet-plugins-self
        hostPath:
          path: /var/lib/kubelet/plugins/io.meoe.poly-csi
          type: DirectoryOrCreate
      - name: registration-dir
        hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: Directory
      - name: host-var-lib-kubelet-csi
        hostPath:
          path: /var/lib/kubelet/plugins/kubernetes.io/csi/io.meoe.poly-csi/
          type: DirectoryOrCreate
      - name: host-var-lib-kubelet-pods
        hostPath:
          path: /var/lib/kubelet/pods/
          type: Directory
      - name: host-dev
        hostPath:
          path: /dev
          type: Directory
      - name: poly-csi-plugins
        hostPath:
          path: /run/io.meoe.poly-csi/plugins
          type: DirectoryOrCreate
      - name: config-node
        configMap:
          name: node-config
      - name: host-root
        hostPath:
          path: /
          type: Directory
      - name: kernel-modules
        hostPath:
          path: /lib/modules
          type: Directory
      - name: config-iscsi
        configMap:
          name: node-plugin-iscsi-config
      - name: config-ublk
        configMap:
          name: node-plugin-ublk-config

      tolerations:
      - effect: NoSchedule
        operator: Exists
