---
kind: DaemonSet
apiVersion: apps/v1
metadata:
  namespace: pv-poly
  name: poly-csi-node
  labels:
    app.kubernetes.io/name: poly-csi
    app.kubernetes.io/csi-role: node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: poly-csi
      app.kubernetes.io/csi-role: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: poly-csi
        app.kubernetes.io/csi-role: node
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-node-critical
      # hostNetwork is required to correctly report node IPs and communicate with multipathd and iscsiadm
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: csi-driver
        image: harbor.k8s.lan/local-test/poly-csi-node:v0.2.120
        args:
        - --csi-name=io.meoe.poly-csi
        - --listen-address=unix:///csi-data/csi.sock
        - --log-level=debug
        - --csi-node-id=$(CSI_NODE_ID)
        - --node-config=/poly-csi/config/config.yaml
        resources:
          limits:
            memory: 150Mi
          requests:
            cpu: 10m
            memory: 15Mi
        securityContext:
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
        env:
        - name: CSI_NODE_ID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        volumeMounts:
        - mountPath: /csi-data
          name: socket-dir
        - mountPath: /var/lib/kubelet
          name: kubelet-dir
          mountPropagation: Bidirectional
        - mountPath: /etc/nvme
          name: nvme-dir
        - mountPath: /host/dev
          name: dev-dir
        - mountPath: /poly-csi/node
          name: poly-csi-config
        - mountPath: /poly-csi/config
          name: node-config
        - mountPath: /run/io.meoe.poly-csi/plugins
          name: poly-csi-plugins
          mountPropagation: Bidirectional

      - name: driver-registrar
        image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.15.0
        args:
        - --v=5
        - --csi-address=/csi-data/csi.sock
        - --kubelet-registration-path=/var/lib/kubelet/plugins/io.meoe.poly-csi/csi.sock
        resources:
          limits:
            memory: 30Mi
          requests:
            cpu: 10m
            memory: 20Mi
        env:
        - name: KUBE_NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        livenessProbe:
          exec:
            command:
            - /csi-node-driver-registrar
            - --kubelet-registration-path=/var/lib/kubelet/plugins/io.meoe.poly-csi/csi.sock
            - --mode=kubelet-registration-probe
        volumeMounts:
        - mountPath: /csi-data
          name: socket-dir
        - mountPath: /registration
          name: registration-dir
        - mountPath: /var/lib/kubelet
          name: kubelet-dir

      - name: iscsi-connector
        image: harbor.k8s.lan/local-test/poly-csi-mounter-plugin:v0.2.120
        args:
        - --plugin-type=connector
        - --node-config=/poly-csi/iscsi-config/config.yaml
        resources:
          limits:
            memory: 150Mi
          requests:
            cpu: 10m
            memory: 15Mi
        securityContext:
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
        volumeMounts:
        - mountPath: /var/lib/kubelet
          name: kubelet-dir
          mountPropagation: Bidirectional
        - mountPath: /host
          name: host-dir
          mountPropagation: Bidirectional
        # - mountPath: /sys
        #   name: sys-dir
        - mountPath: /poly-csi/iscsi-config
          name: iscsi-config
        - mountPath: /run/io.meoe.poly-csi/plugins/iscsi-container
          name: poly-csi-plugins
          mountPropagation: Bidirectional
          subPath: iscsi-container
        - mountPath: /etc/iscsi/
          name: host-dir
          readOnly: true
          subPath: etc/iscsi/

      volumes:
      - name: socket-dir
        hostPath:
          path: /var/lib/kubelet/plugins/io.meoe.poly-csi
          type: DirectoryOrCreate
      - name: plugins-dir
        hostPath:
          path: /var/lib/kubelet/plugins
          type: Directory
      - name: registration-dir
        hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: Directory
      - name: kubelet-dir
        hostPath:
          path: /var/lib/kubelet
          type: Directory
      - name: nvme-dir
        hostPath:
          path: /etc/nvme
          type: Directory
      - name: dev-dir
        hostPath:
          path: /dev
          type: Directory
      - name: poly-csi-config
        hostPath:
          path: /etc/io.meoe.poly-csi
          type: DirectoryOrCreate
      - name: poly-csi-plugins
        hostPath:
          path: /run/io.meoe.poly-csi/plugins
          type: DirectoryOrCreate
      - name: node-config
        configMap:
          name: node-config
      - name: host-dir
        hostPath:
          path: /
          type: Directory
      - name: iscsi-config
        configMap:
          name: node-plugin-iscsi-config
      tolerations:
      - effect: NoSchedule
        operator: Exists
