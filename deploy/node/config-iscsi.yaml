
socket: /run/io.meoe.poly-csi/plugins/iscsi-container/iscsi.sock
# socket: ./iscsi.sock

devFolder: /host/dev

connector:
- id: iscsi
  type: iscsiadm
  config:
    iscsiadmCmd: [ "chroot", "/host", "iscsiadm" ]
    initiatorNamePath: /host/etc/iscsi/initiatorname.iscsi

logs:
  logLevel: debug
  echoCommands: true
  confirmMicroOps: true
  skipOnSuccess: false
