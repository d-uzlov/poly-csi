
socket: /run/io.meoe.poly-csi/plugins/ublk-container/ublk.sock
# socket: ./iscsi.sock

devFolder: /host/dev

connector:
- id: ublk_nbd
  type: ublk_nbd
  config:
    iscsiadmCmd: [ "chroot", "/host", "iscsiadm" ]
    initiatorNamePath: /host/etc/iscsi/initiatorname.iscsi

logs:
  logLevel: debug
  echoCommands: true
  confirmMicroOps: true
  skipOnSuccess: false
